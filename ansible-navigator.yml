---
ansible-navigator:
  execution-environment:
    enabled: true
    image: forge.macopla.com/homelab/ansible/ansible-ee:latest
    container-engine: podman
    pull:
      policy: missing
    environment-variables:
      pass:
        - VAULT_TOKEN
  playbook-artifact:
    save-as: /tmp/{playbook_name}-artifact-{time_stamp}.json
