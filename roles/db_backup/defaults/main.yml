---
db_backup_dir: /var/backups/databases
db_backup_env_file: /etc/db-backup.env
db_backup_pbs_user: "yoann@pbs!databases"
db_backup_pbs_namespace: Macopla/databases
db_backup_vault_path: backup/databases-pbs
db_backup_on_calendar: "*-*-* 01:00:00"
