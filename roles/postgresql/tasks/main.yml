---
- name: Installer PostgreSQL
  ansible.builtin.apt:
    name:
      - postgresql
      - postgresql-client
      - python3-psycopg2
    state: present

- name: Configurer l'adresse d'écoute
  ansible.builtin.lineinfile:
    path: /etc/postgresql/17/main/postgresql.conf
    regexp: "^#?listen_addresses"
    line: "listen_addresses = '{{ postgresql_listen }}'"
  notify: Redémarrer PostgreSQL

- name: Autoriser les connexions depuis le réseau
  ansible.builtin.lineinfile:
    path: /etc/postgresql/17/main/pg_hba.conf
    line: "host all all {{ postgresql_allowed_network }} scram-sha-256"
  notify: Redémarrer PostgreSQL

- name: Créer le répertoire tmp Ansible # Task ajouter pour corriger warning Ansible
  ansible.builtin.file:
    path: /var/lib/postgresql/.ansible/tmp
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Créer les utilisateurs PostgreSQL
  become: true
  become_user: postgres
  community.postgresql.postgresql_user:
    name: "{{ item.user }}"
    password: "{{ item.password }}"
  loop: "{{ postgresql_databases }}"
  no_log: true

- name: Créer les bases de données
  become: true
  become_user: postgres
  community.postgresql.postgresql_db:
    name: "{{ item.name }}"
    owner: "{{ item.user }}"
  loop: "{{ postgresql_databases }}"
  no_log: true
