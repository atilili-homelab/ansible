---
- name: Créer l'utilisateur système openbao
  ansible.builtin.user:
    name: openbao
    system: true
    shell: /bin/false
    home: /opt/openbao
    create_home: false

- name: Créer les répertoires
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
  loop:
    - /opt/openbao
    - "{{ openbao_raft_dir }}"
    - "{{ openbao_config_dir }}"

- name: Télécharger et installer le paquet OpenBao
  ansible.builtin.apt:
    deb: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.deb"
  notify: restart openbao

- name: Déployer la configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: openbao
    group: openbao
    mode: "0640"
  notify: restart openbao

- name: Activer et démarrer OpenBao
  ansible.builtin.systemd:
    name: openbao
    enabled: true
    state: started
    daemon_reload: true
