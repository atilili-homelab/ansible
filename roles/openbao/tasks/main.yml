---
- name: Créer l'utilisateur système openbao
  ansible.builtin.user:
    name: openbao
    system: true
    shell: /bin/false
    home: /opt/openbao
    create_home: false

- name: Créer les répertoires
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"
  loop:
    - /opt/openbao
    - "{{ openbao_raft_dir }}"
    - "{{ openbao_config_dir }}"

- name: Télécharger et installer le paquet OpenBao
  ansible.builtin.apt:
    deb: "https://github.com/openbao/openbao/releases/download/v{{ openbao_version }}/openbao_{{ openbao_version }}_linux_amd64.deb"
  notify: Restart openbao

- name: Déployer la configuration
  ansible.builtin.template:
    src: openbao.hcl.j2
    dest: "{{ openbao_config_dir }}/openbao.hcl"
    owner: openbao
    group: openbao
    mode: "0640"
  notify: Restart openbao

- name: Activer et démarrer OpenBao
  ansible.builtin.systemd:
    name: openbao
    enabled: true
    state: started
    daemon_reload: true

- name: Créer le dossier des certificats
  ansible.builtin.file:
    path: "{{ openbao_config_dir }}/tls"
    state: directory
    owner: openbao
    group: openbao
    mode: "0750"

- name: Copier le certificat
  ansible.builtin.copy:
    src: "/etc/letsencrypt/live/{{ openbao_domain }}/{{ item }}"
    dest: "{{ openbao_config_dir }}/tls/{{ item }}"
    remote_src: true
    owner: openbao
    group: openbao
    mode: "0600"
  loop:
    - fullchain.pem
    - privkey.pem
  notify: Restart openbao

- name: Déployer le hook de renouvellement certbot
  ansible.builtin.template:
    src: certbot-deploy-hook.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/openbao
    owner: root
    group: root
    mode: "0755"
