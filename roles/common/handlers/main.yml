---
- name: Restart sshd
  ansible.builtin.systemd:
    name: sshd
    state: restarted

- name: Restart chrony
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.service:
    name: "{{ common_chrony_service_name }}"
    state: restarted

- name: Restart zramswap
  ansible.builtin.service:
    name: zramswap
    state: restarted
    enabled: true
