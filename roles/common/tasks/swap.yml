---
- name: Swap - Installer zram-tools
  ansible.builtin.package:
    name: zram-tools
    state: present

- name: Swap - Configurer ZRAM
  ansible.builtin.copy:
    content: |
      PERCENT=50
      ALGO=lz4
      PRIORITY=100
    dest: "/etc/default/zramswap"
    mode: "0644"
  notify: Restart zramswap

- name: Swap - check si le swapfile existe deja
  register: common_swap_check
  ansible.builtin.stat:
    path: "{{ common_swap_file_path }}"

- name: Swap - Check swap usage
  ansible.builtin.command: swapon --show
  register: common_current_swap
  changed_when: false

- name: Swap - Check swap status
  ansible.builtin.debug:
    msg: "Current swap: {{ common_current_swap.stdout | default('Pas de swap configurer') }}"

- name: Swap - Créer le swapfile avec dd
  when: not common_swap_check.stat.exists
  register: common_dd_result
  changed_when: true
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of={{ common_swap_file_path }} bs=1M count={{ common_swap_file_size_mb }}"

- name: Swap - Permissions du swapfile
  ansible.builtin.file:
    path: "{{ common_swap_file_path }}"
    mode: "0600"
    owner: root
    group: root

- name: Swap - Formater le fichier en espace swap
  when: not common_swap_check.stat.exists
  changed_when: true
  ansible.builtin.command:
    cmd: "mkswap {{ common_swap_file_path }}"

- name: Swap - Activer le fichier de swap
  when: common_swap_file_path not in common_current_swap.stdout
  changed_when: true
  ansible.builtin.command:
    cmd: "swapon {{ common_swap_file_path }}"

- name: Swap - Ajouter le ficher de swap au fstab
  ansible.posix.mount:
    path: none
    src: "{{ common_swap_file_path }}"
    fstype: swap
    opts: sw
    state: present

- name: Swap - Configuration swapiness
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ common_swappiness }}"
    sysctl_set: true
    state: present
    reload: true

- name: Swap - Configuration vfs cach pressure
  ansible.posix.sysctl:
    name: vm.vfs_cache_pressure
    value: "{{ common_vfs_cache_pressure }}"
    sysctl_set: true
    state: present
    reload: true
