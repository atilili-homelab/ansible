---
# Les fichiers de sshd_config.d sont lus avant sshd_config, et sshd garde la première
# valeur trouvée : le préfixe 00- passe devant les fichiers des images (50-cloud-init.conf)
- name: SSHD - Déposer la configuration durcie
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: "sshd -t -f %s"
  notify: Restart sshd

- name: SSHD - Appliquer le restart de sshd
  ansible.builtin.meta: flush_handlers
