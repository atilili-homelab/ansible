---
- name: Sauvegarde Postgres - Vérifier les cibles
  ansible.builtin.assert:
    that: postgres_backup_targets | length > 0
    fail_msg: "postgres_backup_targets est vide : rien à sauvegarder"

- name: Sauvegarde Postgres - Créer le dossier des dumps
  ansible.builtin.file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    mode: "0700"

- name: Sauvegarde Postgres - Déposer les accès à PBS
  ansible.builtin.copy:
    content: |
      PBS_REPOSITORY='{{ postgres_backup_pbs_user }}@{{ pbs_server }}:{{ pbs_datastore }}'
      PBS_FINGERPRINT='{{ pbs_fingerprint }}'
      PBS_PASSWORD='{{ lookup('community.hashi_vault.vault_kv2_get', postgres_backup_vault_path).secret.secret }}'
    dest: "{{ postgres_backup_env_file }}"
    mode: "0600"
  no_log: true

- name: Sauvegarde Postgres - Installer le script
  ansible.builtin.template:
    src: postgres-backup.sh.j2
    dest: /usr/local/bin/postgres-backup
    mode: "0750"

- name: Sauvegarde Postgres - Installer le service et le timer
  ansible.builtin.template:
    src: "postgres-backup.{{ item }}.j2"
    dest: "/etc/systemd/system/postgres-backup.{{ item }}"
    mode: "0644"
  loop:
    - service
    - timer

- name: Sauvegarde Postgres - Activer le timer
  ansible.builtin.systemd_service:
    name: postgres-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  ignore_errors: "{{ ansible_check_mode }}"
