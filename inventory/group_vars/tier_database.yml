common_swappiness: 1
common_vfs_cache_pressure: 50

db_backup_targets:
  - { container: authelia_postgres, user: postgres, name: authelia }
  - { container: authentik_authentik-db, user: authentik }
  - { container: bookstack_bookstack-db, engine: mariadb }
  - { container: immich_immich-db, user: immich }
  - container: komodo_mongo
    engine: mongodb
    name: komodo
    user: komodo
    database: komodo
    auth_database: admin
    secret_path: services/komodo
    secret_key: db_password
  - { container: ntfy_ntfy-db, user: ntfy }
  - { container: prometheus_grafana-db, user: grafana }
  - { container: tracearr_tracearr-db, user: tracearr }
  - { container: mediarr_mediarr-db, user: postgres }
