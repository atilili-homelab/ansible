---
- name: Synchro des secrets Docker Swarm depuis OpenBao
  hosts: swarm_managers[0]
  vars:
    vault_secrets:
      #  AUTHELIA
      - docker_secret: authelia_postgres_password
        vault_path: services/authelia
        vault_key: postgres_password
      - docker_secret: authelia_db_password
        vault_path: services/authelia
        vault_key: db_password
      - docker_secret: authelia_ldap_password
        vault_path: services/authelia
        vault_key: ldap_password
      - docker_secret: authelia_reset_password_jwt_secret
        vault_path: services/authelia
        vault_key: reset_password_jwt_secret
      - docker_secret: authelia_session_secret
        vault_path: services/authelia
        vault_key: session_secret
      - docker_secret: authelia_storage_encryption_key
        vault_path: services/authelia
        vault_key: storage_encryption_key
      - docker_secret: authelia_smtp_password
        vault_path: services/authelia
        vault_key: smtp_password
      - docker_secret: authelia_oidc_jwks_key
        vault_path: services/authelia
        vault_key: oidc_jwks_key
      - docker_secret: authelia_oidc_hmac_secret
        vault_path: services/authelia
        vault_key: oidc_hmac_secret

      #  AUTHENTIK
      - docker_secret: authentik_db_password
        vault_path: databases/authentik
        vault_key: db_password
      - docker_secret: authentik_redis_password
        vault_path: databases/authentik
        vault_key: redis_password

      #  CLOUDFLARE_DDNS
      - docker_secret: cloudflare_ddns_api_token
        vault_path: services/cloudflare_ddns
        vault_key: api_token

      # GATUS
      - docker_secret: gatus_push_token
        vault_path: services/gatus
        vault_key: push_token

      # GRAFANA
      - docker_secret: grafana_admin_password
        vault_path: databases/grafana
        vault_key: admin_password
      - docker_secret: grafana_db_password
        vault_path: databases/grafana
        vault_key: db_password

      # HOMARR
      - docker_secret: homarr_redis_password
        vault_path: databases/homarr
        vault_key: redis_password

      # IMMICH
      - docker_secret: immich_redis_password
        vault_path: databases/immich
        vault_key: redis_password

      # KOMODO
      - docker_secret: komodo_db_password
        vault_path: services/komodo
        vault_key: db_password
      - docker_secret: komodo_private_key
        vault_path: services/komodo
        vault_key: private_key
      - docker_secret: komodo_webhook_secret
        vault_path: services/komodo
        vault_key: webhook_secret
      - docker_secret: komodo_oidc_client_secret
        vault_path: services/komodo
        vault_key: oidc_client_secret

      # LLDAP
      - docker_secret: lldap_db_password
        vault_path: services/lldap
        vault_key: db_password
      - docker_secret: lldap_jwt_secret
        vault_path: services/lldap
        vault_key: jwt_secret
      - docker_secret: lldap_key_seed
        vault_path: services/lldap
        vault_key: key_seed
      - docker_secret: lldap_admin_password
        vault_path: services/lldap
        vault_key: admin_password

      # MEDIARR
      - docker_secret: mediarr_postgres_password
        vault_path: services/mediarr
        vault_key: postgres_password
      - docker_secret: prowlarr_db_password
        vault_path: services/mediarr
        vault_key: prowlarr_db_password
      - docker_secret: radarr_db_password
        vault_path: services/mediarr
        vault_key: radarr_db_password
      - docker_secret: sonarr_db_password
        vault_path: services/mediarr
        vault_key: sonarr_db_password
      - docker_secret: bazarr_db_password
        vault_path: services/mediarr
        vault_key: bazarr_db_password
      - docker_secret: seerr_db_password
        vault_path: services/mediarr
        vault_key: seerr_db_password
      - docker_secret: recyclarr_secrets
        vault_path: services/mediarr
        vault_key: recyclarr_secrets

      # PROXMOX
      - docker_secret: pve_exporter_config
        vault_path: configs/pve_exporter
        vault_key: config

      # REDIS
      - docker_secret: redis_password
        vault_path: databases/redis
        vault_key: db_password

      # TRAEFIK
      - docker_secret: traefik_cloudflare_api_token
        vault_path: services/traefik
        vault_key: cloudflare_api_token
      - docker_secret: traefik_crowdsec_lapi_key
        vault_path: services/traefik
        vault_key: crowdsec_lapi_key

  pre_tasks:
    - name: Installer le SDK Python Docker
      ansible.builtin.apt:
        name: python3-docker
        state: present
      become: true

  tasks:
    - name: Créer ou mettre à jour les secrets Docker
      community.docker.docker_secret:
        name: "{{ item.docker_secret }}"
        data: "{{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret[item.vault_key] }}"
        state: present
      loop: "{{ vault_secrets }}"

- name: Synchro des secrets Docker du VPS depuis OpenBao
  hosts: vps
  vars:
    vault_envfiles:
      #  GATUS
      - name: gatus
        vault_path: services/gatus

    vault_secrets:
      # TRAEFIK-VPS
      - docker_secret: traefik_cloudflare_api_token
        vault_path: services/traefik_vps
        vault_key: cloudflare_api_token

  tasks:
    - name: Créer le dossier des secrets
      ansible.builtin.file:
        path: /etc/docker-secrets
        state: directory
        owner: root
        group: komodo
        mode: "0750"
      become: true

    - name: Écrire les secrets
      ansible.builtin.copy:
        content: "{{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret[item.vault_key] }}"
        dest: "/etc/docker-secrets/{{ item.docker_secret }}"
        owner: root
        mode: "0400"
      loop: "{{ vault_secrets }}"
      no_log: true
      become: true

    - name: Écrire les fichiers env
      ansible.builtin.copy:
        content: |
          {% for key, value in lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret.items() %}
          {{ key | upper }}={{ value }}
          {% endfor %}
        dest: "/etc/docker-secrets/{{ item.name }}.env"
        owner: komodo
        mode: "0400"
      loop: "{{ vault_envfiles }}"
      no_log: true
      become: true
