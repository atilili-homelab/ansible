---
- name: Synchro des secrets Docker Swarm depuis OpenBao
  hosts: swarm_managers[0]
  vars:
    vault_secrets:
      - docker_secret: komodo_db_password
        vault_path: databases/komodo
        vault_key: db_password
      - docker_secret: authentik_db_password
        vault_path: databases/authentik
        vault_key: db_password
      - docker_secret: authentik_redis_password
        vault_path: databases/authentik
        vault_key: redis_password
      - docker_secret: immich_redis_password
        vault_path: databases/immich
        vault_key: redis_password
      - docker_secret: homarr_redis_password
        vault_path: databases/homarr
        vault_key: redis_password
      - docker_secret: redis_password
        vault_path: databases/redis
        vault_key: db_password
      - docker_secret: pve_exporter_config
        vault_path: configs/pve_exporter
        vault_key: config
      - docker_secret: grafana_db_password
        vault_path: databases/grafana
        vault_key: db_password
      - docker_secret: grafana_admin_password
        vault_path: databases/grafana
        vault_key: admin_password

  pre_tasks:
    - name: Installer le SDK Python Docker
      ansible.builtin.apt:
        name: python3-docker
        state: present
      become: true

  tasks:
    - name: Creer/mettre a jour les docker secrets
      community.docker.docker_secret:
        name: "{{ item.docker_secret }}"
        data: "{{ lookup('community.hashi_vault.vault_kv2_get', item.vault_path).secret[item.vault_key] }}"
        state: present
      loop: "{{ vault_secrets }}"
