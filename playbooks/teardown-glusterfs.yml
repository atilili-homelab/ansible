---
# Démantèlement ponctuel de GlusterFS (volume gv0).
# À supprimer du dépôt une fois joué : le rôle est archivé sous le tag `archive/glusterfs`.
#
# Les groupes `gluster*` n'existent plus dans l'inventaire : les cibles sont les
# groupes de tier qui en étaient membres.
#   serveurs : tier_infra, tier_apps
#   arbitre  : tier_monitor
#   clients  : manager, seedbox, tier_database, tier_media, tier_standalone
#
# Simulation : ansible-playbook playbooks/teardown-glusterfs.yml -e glusterfs_teardown_confirm=true --check
# Exécution  : ansible-playbook playbooks/teardown-glusterfs.yml -e glusterfs_teardown_confirm=true
#
# En --check, les commandes `gluster` (module command) ne sont pas simulées : seules
# les lectures (état du volume, liste des pairs) sont exécutées pour décider.

- name: Teardown GlusterFS - Garde-fou
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  tasks:
    - name: Teardown GlusterFS - Exiger la confirmation explicite
      ansible.builtin.assert:
        that:
          - glusterfs_teardown_confirm | default(false) | bool
        fail_msg: >-
          Opération destructive (suppression du volume gv0 et des bricks).
          Relancer avec -e glusterfs_teardown_confirm=true pour confirmer.
        quiet: true

- name: Teardown GlusterFS - Démonter le volume partout
  hosts: tier_infra:tier_apps:tier_monitor:manager:seedbox:tier_database:tier_media:tier_standalone
  gather_facts: false
  vars:
    glusterfs_mount_point: /data/gluster
  tasks:
    # state: absent démonte, retire l'entrée fstab puis fait un rmdir du point de montage
    # (échoue s'il n'est pas vide : /data lui-même appartient au rôle disk_data et n'est pas touché)
    - name: Teardown GlusterFS - Démonter et retirer l'entrée fstab
      ansible.posix.mount:
        path: "{{ glusterfs_mount_point }}"
        state: absent

- name: Teardown GlusterFS - Supprimer le volume et le cluster
  hosts: tier_infra:tier_apps:tier_monitor
  gather_facts: false
  vars:
    glusterfs_volume_name: gv0
    glusterfs_brick_dir: /data/brick
    # Premier serveur (hors arbitre) : porte les commandes de cluster
    glusterfs_teardown_leader: "{{ (groups['tier_infra'] + groups['tier_apps'])[0] }}"
  tasks:
    - name: Teardown GlusterFS - Lire l'état du volume
      ansible.builtin.command: gluster volume info {{ glusterfs_volume_name }}
      register: glusterfs_volume_info
      delegate_to: "{{ glusterfs_teardown_leader }}"
      run_once: true
      check_mode: false
      failed_when: false
      changed_when: false

    # Volume absent, glusterd arrêté ou binaire déjà désinstallé : rc != 0, rien à faire
    - name: Teardown GlusterFS - Arrêter le volume
      ansible.builtin.command: gluster --mode=script volume stop {{ glusterfs_volume_name }}
      delegate_to: "{{ glusterfs_teardown_leader }}"
      run_once: true
      when:
        - glusterfs_volume_info.rc | default(1) == 0
        - "'Status: Started' in glusterfs_volume_info.stdout"
      changed_when: true

    - name: Teardown GlusterFS - Supprimer le volume
      ansible.builtin.command: gluster --mode=script volume delete {{ glusterfs_volume_name }}
      delegate_to: "{{ glusterfs_teardown_leader }}"
      run_once: true
      when: glusterfs_volume_info.rc | default(1) == 0
      changed_when: true

    - name: Teardown GlusterFS - Lister les pairs du cluster
      ansible.builtin.command: gluster pool list
      register: glusterfs_pool
      delegate_to: "{{ glusterfs_teardown_leader }}"
      run_once: true
      check_mode: false
      failed_when: false
      changed_when: false

    # Les pairs sont détachés tant que glusterd tourne encore sur chacun
    - name: Teardown GlusterFS - Détacher les pairs
      ansible.builtin.command: gluster --mode=script peer detach {{ item }}
      loop: >-
        {{ (glusterfs_pool.stdout_lines | default([]))[1:]
           | map('split') | map(attribute='1')
           | reject('equalto', 'localhost') | list
           if glusterfs_pool.rc | default(1) == 0 else [] }}
      delegate_to: "{{ glusterfs_teardown_leader }}"
      run_once: true
      changed_when: true

    - name: Teardown GlusterFS - Arrêter et désactiver glusterd
      ansible.builtin.systemd:
        name: glusterd
        state: stopped
        enabled: false
      register: glusterfs_glusterd
      # Unité absente : paquet déjà purgé lors d'un passage précédent
      failed_when:
        - glusterfs_glusterd is failed
        - "'Could not find' not in (glusterfs_glusterd.msg | default(''))"

    - name: Teardown GlusterFS - Purger le paquet serveur
      ansible.builtin.apt:
        name: glusterfs-server
        state: absent
        purge: true
        autoremove: true

    - name: Teardown GlusterFS - Supprimer le répertoire brick
      ansible.builtin.file:
        path: "{{ glusterfs_brick_dir }}"
        state: absent

- name: Teardown GlusterFS - Purger le client partout
  hosts: tier_infra:tier_apps:tier_monitor:manager:seedbox:tier_database:tier_media:tier_standalone
  gather_facts: false
  tasks:
    - name: Teardown GlusterFS - Purger le paquet client
      ansible.builtin.apt:
        name: glusterfs-client
        state: absent
        purge: true
        autoremove: true
