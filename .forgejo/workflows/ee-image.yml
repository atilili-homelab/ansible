name: Build EE and Run Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "execution-environment.yml"
      - "requirements.yml"
      - "requirements.txt"
      - "bindep.txt"
      - ".forgejo/workflows/ee-image.yml"

jobs:
  build-ee:
    name: Build Execution Environment
    runs-on: podman-nix
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      DOCKER_BUILDKIT: "0"
      IMAGE: ansible-ee
      IMAGE_PATH: forge.macopla.com/homelab/ansible/ansible-ee
    steps:
      - name: Install nodejs
        run: nix profile add nixpkgs#nodejs-slim

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install docker client
        run: nix profile add nixpkgs#docker-client

      - name: Build the Execution Environment
        run: |
          nix develop -c ansible-builder build \
            --container-runtime docker \
            --tag $IMAGE:$FORGEJO_SHA \
            --verbosity 3

      - name: Check collections
        run: |
          docker run --rm $IMAGE:$FORGEJO_SHA \
            ansible-galaxy collection list

      - name: Verify Python packages
        run: |
          docker run --rm $IMAGE:$FORGEJO_SHA \
            pip check

      - name: Push image
        run: |
          for tag in $FORGEJO_SHA latest; do
            nix shell --inputs-from . nixpkgs#skopeo -c \
              skopeo --insecure-policy \
              copy -- dest-creds "ci-bot:${{ secrets.CI_ANSIBLE_PUSH_TOKEN }}" \
              docker-daemon:$IMAGE:$FORGEJO_SHA \
              docker://$IMAGE_PATH:$tag
          done

      - name: Rmi image
        if: always()
        run: |
          docker rmi $IMAGE:$FORGEJO_SHA
