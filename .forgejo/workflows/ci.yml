on:
  push:
    branches-ignore: [main]

name: Test

jobs:
  pre-commit:
    name: Pre-commit
    # Host mode: mouse's persistent store keeps the devShell between runs
    runs-on: nixos
    env:
      SKIP: ansible-lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: nix develop -c gitleaks git --redact --verbose --log-opts="origin/main..HEAD"
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Pre-commit
        run: nix develop -c pre-commit run --all-files --show-diff-on-failure

  ansible-lint:
    name: Ansible-lint
    runs-on: podman-nix
    env:
      HOME: /runner
      ANSIBLE_LOG_PATH: /tmp/ansible.log
    container:
      image: forge.macopla.com/homelab/ansible/ansible-ee:latest@sha256:e0d01219be67c861b65988b94416c98aad2fa30067e26575ab196e4ad5527ae1
      credentials:
        username: ci-bot
        password: ${{ secrets.CI_ANSIBLE_PULL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ansible-lint
        run: ansible-lint
